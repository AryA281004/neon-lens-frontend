name: FRONTEND DEPLOYMENT

on:
  workflow_run:
    workflows:
      - "FRONTEND BUILD"
    types:
      - completed

env:
  AWS_REGION: us-east-1

jobs:

  # ============================================================
  # DEPLOY TO S3 + CLOUDFRONT
  # ============================================================

  deploy:
    name: Deploy Frontend to S3 + CloudFront

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read
      actions: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ secrets.FRONTEND_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:

      # ========================================================
      # SET DEPLOYMENT VARIABLES
      # ========================================================

      - name: Set deployment variables
        run: |
          SOURCE_COMMIT="${{ github.event.workflow_run.head_sha }}"

          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Neon Lens Frontend Deployment"
          echo "=============================================="
          echo "Source commit : $SOURCE_COMMIT"
          echo "S3 bucket     : $S3_BUCKET"
          echo "CloudFront    : $CLOUDFRONT_DISTRIBUTION_ID"
          echo "=============================================="


      # ========================================================
      # DOWNLOAD BUILD ARTIFACT
      # ========================================================

      - name: Download frontend build artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;

            const artifacts =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId
              });

            const artifact = artifacts.data.artifacts.find(
              artifact =>
                artifact.name === `frontend-dist-${context.payload.workflow_run.head_sha}`
            );

            if (!artifact) {
              core.setFailed(
                `Frontend artifact not found for commit ${context.payload.workflow_run.head_sha}`
              );
              return;
            }

            const download =
              await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip'
              });

            require('fs').writeFileSync(
              'frontend-artifact.zip',
              Buffer.from(download.data)
            );

            console.log(`Downloaded artifact: ${artifact.name}`);


      # ========================================================
      # EXTRACT ARTIFACT
      # ========================================================

      - name: Extract frontend artifact
        run: |
          echo "Extracting frontend build..."

          mkdir -p dist

          unzip -q frontend-artifact.zip -d dist

          echo ""
          echo "Frontend artifact extracted."

          test -f dist/index.html


      # ========================================================
      # CONFIGURE AWS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::666729139368:role/github
          role-session-name: github-actions-frontend-deploy


      # ========================================================
      # VERIFY AWS ACCESS
      # ========================================================

      - name: Verify AWS identity
        run: |
          echo "Verifying AWS identity..."

          aws sts get-caller-identity

          echo ""
          echo "AWS credentials configured successfully."


      # ========================================================
      # DEPLOY TO S3
      # ========================================================

      - name: Deploy frontend to S3
        run: |
          echo "=============================================="
          echo "Uploading frontend to S3"
          echo "=============================================="
          echo "Bucket: $S3_BUCKET"
          echo ""

          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --delete \
            --region "$AWS_REGION"

          echo ""
          echo "Frontend uploaded to S3 successfully."


      # ========================================================
      # CLOUDFRONT INVALIDATION
      # ========================================================

      - name: Invalidate CloudFront cache
        run: |
          echo "=============================================="
          echo "Creating CloudFront invalidation"
          echo "=============================================="

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"

          echo ""
          echo "CloudFront invalidation created successfully."


      # ========================================================
      # DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "Neon Lens Frontend Deployment Successful"
          echo "=============================================="
          echo "Commit        : $SOURCE_COMMIT"
          echo "S3 bucket     : $S3_BUCKET"
          echo "CloudFront ID : $CLOUDFRONT_DISTRIBUTION_ID"
          echo "=============================================="


  # ============================================================
  # SLACK SUCCESS
  # ============================================================

  slack-success:
    name: Notify Slack - Success

    needs:
      - deploy

    if: ${{ needs.deploy.result == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          SLACK_COLOR: good
          SLACK_MESSAGE: "Neon Lens Frontend deployment completed successfully. Commit: ${{ github.event.workflow_run.head_sha }}"
          SLACK_FOOTER: "Neon-Lens (Frontend) - S3 + CloudFront Deployment"


  # ============================================================
  # SLACK FAILURE
  # ============================================================

  slack-failure:
    name: Notify Slack - Failure

    needs:
      - deploy

    if: ${{ needs.deploy.result == 'failure' }}

    runs-on: ubuntu-latest

    steps:

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_DEPLOY }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Neon Lens Frontend deployment FAILED. Commit: ${{ github.event.workflow_run.head_sha }}"
          SLACK_FOOTER: "Neon-Lens (Frontend) - S3 + CloudFront Deployment"

