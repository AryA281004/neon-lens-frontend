name: FRONTEND DEPLOYMENT

on:
  workflow_run:
    workflows:
      - "FRONTEND BUILD"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:

   # ============================================================
  # RESOLVE SOURCE ENVIRONMENT AND COMMIT
  # ============================================================
  resolve-source:
    name: Resolve Build Environment and Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'FRONTEND BUILD' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}

    permissions:
      actions: read
      contents: read

    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      # ------------------------------------------------------------
      # DOWNLOAD METADATA FOR AUTOMATIC DEPLOYMENT
      # ------------------------------------------------------------
      - name: Download deployment metadata
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-metadata-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: deployment-metadata

      # ------------------------------------------------------------
      # RESOLVE AND VALIDATE SOURCE
      # ------------------------------------------------------------
      - name: Resolve source branch and commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BRANCH: ${{ github.ref_name }}
          MANUAL_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            test -f deployment-metadata/metadata.json

            SOURCE_BRANCH="$(jq -er '.branch' deployment-metadata/metadata.json)"
            SOURCE_COMMIT="$(jq -er '.commit' deployment-metadata/metadata.json)"
          else
            SOURCE_BRANCH="$MANUAL_BRANCH"
            SOURCE_COMMIT="$MANUAL_COMMIT"
          fi

          case "$SOURCE_BRANCH" in
            dev|pre|prod) ;;
            *)
              echo "::error::Unsupported source environment: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid source commit SHA: $SOURCE_COMMIT"
            exit 1
          fi

          echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Resolved environment: $SOURCE_BRANCH"
          echo "Resolved commit: $SOURCE_COMMIT"

  # ============================================================
  # DEPLOY TO S3 + CLOUDFRONT
  # ============================================================

  deploy:
    name: Deploy Frontend to S3 + CloudFront

    needs: resolve-source

    if: ${{ needs.resolve-source.result == 'success' }}

    environment:
      name: ${{ needs.resolve-source.outputs.source_branch }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ========================================================
      # SET DEPLOYMENT VARIABLES
      # ========================================================

      
      - name: Set deployment variables
        id: deployment
        shell: bash
        env:
          SOURCE_BRANCH: ${{ needs.resolve-source.outputs.source_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          FRONTEND_BUCKET_NAME: ${{ secrets.FRONTEND_BUCKET_NAME }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$FRONTEND_BUCKET_NAME" || -z "$DISTRIBUTION_ID" ]]; then
            echo "::error::Missing S3 bucket or CloudFront distribution secret for $SOURCE_BRANCH."
            exit 1
          fi

          case "$SOURCE_BRANCH" in
            dev)
              AWS_REGION="eu-west-1"
              ;;
            pre)
              AWS_REGION="us-east-2"
              ;;
            prod)
              AWS_REGION="us-east-1"
              ;;
            *)
              echo "::error::Unsupported deployment branch: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          {
            echo "SOURCE_BRANCH=$SOURCE_BRANCH"
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$FRONTEND_BUCKET_NAME"
            echo "CLOUDFRONT_DISTRIBUTION_ID=$DISTRIBUTION_ID"
          } >> "$GITHUB_ENV"

          echo "=============================================="
          echo "Neon Lens Frontend Deployment"
          echo "=============================================="
          echo "Environment   : $SOURCE_BRANCH"
          echo "Source commit : $SOURCE_COMMIT"
          echo "AWS region    : $AWS_REGION"
          echo "S3 bucket     : $FRONTEND_BUCKET_NAME"
          echo "CloudFront    : $DISTRIBUTION_ID"
          echo "=============================================="

      # ========================================================
      # CHECKOUT SOURCE COMMIT
      # ========================================================

      - name: Checkout source commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # ========================================================
      # RECORD CHECKED-OUT COMMIT
      # ========================================================

      - name: Verify checked-out commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_COMMIT="$(git rev-parse HEAD)"

          if [[ "$ACTUAL_COMMIT" != "$SOURCE_COMMIT" ]]; then
            echo "::error::Checked-out commit does not match the deployment commit."
            exit 1
          fi

          echo "Verified commit: $ACTUAL_COMMIT"

      # ========================================================
      # DOWNLOAD BUILD ARTIFACT
      # ========================================================

      
      - name: Download frontend build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/github-script@v7
        env:
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.source_commit }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');

            const runId = Number(process.env.SOURCE_RUN_ID);
            const commit = process.env.SOURCE_COMMIT;

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });

            const artifact = artifacts.data.artifacts.find(item =>
              item.name === `frontend-dist-${commit}` && !item.expired
            );

            if (!artifact) {
              core.setFailed(
                `Frontend artifact not found for selected commit ${commit}. ` +
                `Check the build run and its uploaded artifacts.`
              );
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            fs.writeFileSync(
              'frontend-artifact.zip',
              Buffer.from(download.data)
            );

            console.log(`Downloaded artifact: ${artifact.name}`);


      # ========================================================
      # BUILD FRONTEND FOR MANUAL DEPLOYMENT
      # ========================================================

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci

      - name: Build frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Building environment: $TARGET_BRANCH"
          echo "Commit: $SOURCE_COMMIT"

          npm run build

      # ========================================================
      # EXTRACT ARTIFACT
      # ========================================================

      - name: Extract frontend artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -euo pipefail

          echo "Extracting frontend build..."
          mkdir -p dist
          unzip -q frontend-artifact.zip -d dist
          test -f dist/index.html

          echo ""
          echo "Frontend artifact extracted successfully."
          du -sh dist

      # ========================================================
      # VERIFY BUILD OUTPUT
      # ========================================================

      - name: Verify build output
        run: |
          set -euo pipefail

          test -f dist/index.html

          echo "Frontend build output verified."
          du -sh dist

      # ========================================================
      # DEBUG GITHUB OIDC CLAIMS
      # ========================================================

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          OIDC_TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [[ -z "$OIDC_TOKEN" || "$OIDC_TOKEN" == "null" ]]; then
            echo "::error::Failed to obtain OIDC token."
            exit 1
          fi

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)
          PAYLOAD="${PAYLOAD}$(printf '%*s' "$(( (4 - ${#PAYLOAD} % 4) % 4 ))" '' | tr ' ' '=')"

          echo ""
          echo "=============================================="
          echo "GitHub OIDC Claims"
          echo "=============================================="

          echo "$PAYLOAD" \
            | base64 -d 2>/dev/null \
            | jq '{
                iss,
                sub,
                aud,
                repository,
                repository_owner,
                ref,
                environment
              }'

          echo "=============================================="

      # ========================================================
      # CONFIGURE AWS
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::666729139368:role/github
          role-session-name: github-actions-frontend-deploy

      # ========================================================
      # VERIFY AWS ACCESS
      # ========================================================

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."
          aws sts get-caller-identity
          echo ""
          echo "AWS credentials configured successfully."

      # ========================================================
      # DEPLOY TO S3
      # ========================================================

      - name: Deploy frontend to S3
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Uploading frontend to S3"
          echo "=============================================="
          echo "Environment: $SOURCE_BRANCH"
          echo "Bucket: $S3_BUCKET"
          echo ""

          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --delete \
            --region "$AWS_REGION"

          echo ""
          echo "Frontend uploaded to S3 successfully."

      # ========================================================
      # CLOUDFRONT INVALIDATION
      # ========================================================

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"
          echo "CloudFront invalidation created successfully."

      # ========================================================
      # DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment summary
        run: |
          echo "=============================================="
          echo "Neon Lens Frontend Deployment Successful"
          echo "=============================================="
          echo "Environment   : $SOURCE_BRANCH"
          echo "Commit        : $SOURCE_COMMIT"
          echo "AWS region    : $AWS_REGION"
          echo "S3 bucket     : $S3_BUCKET"
          echo "CloudFront ID : $CLOUDFRONT_DISTRIBUTION_ID"
          echo "=============================================="

  
      # ============================================
      # SLACK NOTIFICATIONS
      # ============================================

      - name: Notify Slack — Deployment Successful
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚀 Neon Lens Frontend Deployment Successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Neon Lens | Deployment Successful",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Neon Lens frontend deployment pipeline completed successfully. The S3 synchronization and CloudFront invalidation steps have passed."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*📦 Application*\nNeon Lens Frontend"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🟢 Status*\nSUCCESS"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🌍 Environment*\n`${{ needs.resolve-source.outputs.source_branch }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*☁️ AWS Region*\n`${{ env.AWS_REGION }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🪣 S3 Bucket*\n`${{ env.S3_BUCKET }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🌐 CloudFront Distribution*\n`${{ env.CLOUDFRONT_DISTRIBUTION_ID }}`"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🔎 Source Information*\n*Branch:* `${{ needs.resolve-source.outputs.source_branch }}`\n*Commit:* `${{ needs.resolve-source.outputs.source_commit }}`\n*Triggered by:* `${{ github.actor }}`\n*Run number:* `${{ github.run_number }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Deployment Checklist*\n• Frontend build artifact retrieved\n• AWS credentials configured\n• Frontend files synchronized to S3\n• CloudFront invalidation submitted"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Deployment Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "primary"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Source Commit",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve-source.outputs.source_commit }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Neon Lens CI/CD | GitHub Actions | AWS S3 | Amazon CloudFront"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack — Deployment Failed
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Neon Lens Frontend Deployment Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Neon Lens | Deployment Failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Neon Lens frontend deployment pipeline failed. Review the workflow logs to identify the failing step before retrying."
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*📦 Application*\nNeon Lens Frontend"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔴 Status*\nFAILED"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🌍 Environment*\n`${{ needs.resolve-source.outputs.source_branch }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*☁️ AWS Region*\n`${{ env.AWS_REGION }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*👤 Triggered by*\n`${{ github.actor }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔢 Run Number*\n`${{ github.run_number }}`"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🔎 Source Information*\n*Branch:* `${{ needs.resolve-source.outputs.source_branch }}`\n*Commit:* `${{ needs.resolve-source.outputs.source_commit }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🛠️ Troubleshooting Checklist*\n• Open the failed workflow run and identify the first failing step\n• Verify the environment's S3 bucket and CloudFront secrets\n• Check AWS credentials and IAM permissions\n• Confirm the frontend build artifact exists and is valid\n• Check the S3 sync and CloudFront invalidation logs"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Investigate Failed Run",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "style": "danger"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Inspect Source Commit",
                        "emoji": true
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve-source.outputs.source_commit }}"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Neon Lens CI/CD | Failure alert | Investigate before retrying"
                    }
                  ]
                }
              ]
            }
