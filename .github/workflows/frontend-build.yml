
name: FRONTEND BUILD

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Select frontend environment"
        required: true
        type: choice
        options:
          - dev
          - pre
          - prod

env:
  NODE_VERSION: 22

concurrency:
  group: frontend-build-${{ inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # BUILD FRONTEND
  # ============================================================
  build:
    name: Build Neon Lens Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: ${{ inputs.branch }}

    steps:
      # ------------------------------------------------------------
      # VALIDATE DEPLOYMENT BRANCH
      # ------------------------------------------------------------
      - name: Validate deployment branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          case "$TARGET_BRANCH" in
            dev|pre|prod)
              echo "Building environment: $TARGET_BRANCH"
              ;;
            *)
              echo "::error::Unsupported environment '$TARGET_BRANCH'. Use dev, pre, or prod."
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      # ------------------------------------------------------------
      # RECORD CHECKED-OUT COMMIT
      # ------------------------------------------------------------
      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="$(git rev-parse HEAD)"

          echo "sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Selected environment: ${{ inputs.branch }}"
          echo "Checked-out commit: $SOURCE_COMMIT"

      # ------------------------------------------------------------
      # SETUP NODE
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ------------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "Installing frontend dependencies..."
          npm ci
          echo ""
          echo "Dependencies installed successfully."

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------
      - name: Build frontend
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Building Neon Lens Frontend"
          echo "=============================================="
          echo "Environment: $TARGET_BRANCH"
          echo "Commit: $SOURCE_COMMIT"
          echo ""

          npm run build

          echo ""
          echo "Frontend build completed successfully."

      # ------------------------------------------------------------
      # VERIFY BUILD
      # ------------------------------------------------------------
      - name: Verify build output
        run: |
          set -euo pipefail

          echo "Checking build output..."
          test -f dist/index.html
          echo ""
          echo "Build output verified."
          echo ""
          echo "Build size:"
          du -sh dist

      # ------------------------------------------------------------
      # UPLOAD BUILD ARTIFACT
      # ------------------------------------------------------------
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

          
      # ------------------------------------------------------------
      # CREATE DEPLOYMENT METADATA
      # ------------------------------------------------------------
      - name: Create deployment metadata
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deployment-metadata

          jq -n \
            --arg branch "$TARGET_BRANCH" \
            --arg commit "$SOURCE_COMMIT" \
            '{
              branch: $branch,
              commit: $commit
            }' > deployment-metadata/metadata.json

          cat deployment-metadata/metadata.json

      # ------------------------------------------------------------
      # UPLOAD DEPLOYMENT METADATA
      # ------------------------------------------------------------
      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: frontend-metadata-${{ github.run_id }}
          path: deployment-metadata/metadata.json
          if-no-files-found: error
          retention-days: 7


      # ------------------------------------------------------------
      # BUILD SUMMARY
      # ------------------------------------------------------------
      - name: Build summary
        if: always()
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          echo "=============================================="
          echo "Neon Lens Frontend Build Summary"
          echo "=============================================="
          echo "Repository: ${{ github.repository }}"
          echo "Environment: $TARGET_BRANCH"
          echo "Commit: ${SOURCE_COMMIT:-Not checked out}"
          echo "Status: ${{ job.status }}"
          echo "Artifact: frontend-dist-${SOURCE_COMMIT:-unavailable}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=============================================="

      # ------------------------------------------------------------
      # SLACK NOTIFICATION (SUCCESS + FAILURE)
      # ------------------------------------------------------------
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_BUILD }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: ${{ job.status == 'success' && 'Frontend Build Successful' || 'Frontend Build Failed' }}
          SLACK_MESSAGE: |
            ${{ job.status == 'success' && '✅ Neon Lens Frontend Build Successful' || '❌ Neon Lens Frontend Build Failed' }}

            Repository: ${{ github.repository }}
            Environment: ${{ inputs.branch }}
            Branch: ${{ inputs.branch }}
            Commit: ${{ steps.source.outputs.sha || 'Not checked out' }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_FOOTER: "Neon-Lens Frontend CI"
